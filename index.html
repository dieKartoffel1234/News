<script>
const colorSets = {
  "red":['#733', '#A77', '#CAA'],
  "orange":['#753', '#A97', '#CBA'],
  "yellow":['#773', '#AA7', '#CCA'],
  "green":['#373', '#7A7', '#ACA'],
  "cyan":['#377', '#7AA', '#ACC'],
  "blue":['#337', '#77A', '#AAC'],
  "magenta":['#737', '#A7A', '#CAC'],
  "dark":['#333', '#777', '#AAA']
}
function changeColors(cSet) {
  document.getElementById("colorDropdown").style.display = "none";
  document.documentElement.style.setProperty('--bgCol', colorSets[cSet][0]);
  document.documentElement.style.setProperty('--fgCol', colorSets[cSet][1]);
  document.documentElement.style.setProperty('--hCol', colorSets[cSet][2]);
}
function showLogin() {
  document.getElementById("loginBox").style.display = "flex";
}
function hideLogin() {
  document.getElementById("loginBox").style.display = "none";
}
function openLink(lnk) {
  open(lnk, "_self");
}
</script>
